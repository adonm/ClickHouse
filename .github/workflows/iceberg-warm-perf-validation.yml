# Fork-only CI for the iceberg warm-performance validation branch
# (adonm/iceberg-warm-perf-validation). Not intended for upstream.
#
# Builds the branch, runs the stateless tests added by PRs #115873-#115878,
# and (on workflow_dispatch with run_perf=true) executes the benchmark
# harness in iceberg-warm-perf/.
#
# GitHub-hosted runners are small (4 vCPU / 16 GB / ~14 GB disk), so this
# uses a Release build with ccache and only the `clickhouse` target.
# Perf numbers from shared runners are noisy - use them for gross sanity
# only and re-measure on a dedicated machine.

name: Iceberg warm-perf validation

on:
  push:
    branches:
      - adonm/iceberg-warm-perf-validation
  workflow_dispatch:

jobs:
  build:
    runs-on: iceberg-warm-perf
    timeout-minutes: 360
    container:
      image: clickhouse/binary-builder:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=OFF
      - name: Build clickhouse
        run: cd build && ninja clickhouse
      - name: Disk usage
        run: df -h && du -sh build
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-binary
          path: build/programs/clickhouse
          retention-days: 3

  stateless:
    needs: build
    runs-on: iceberg-warm-perf
    timeout-minutes: 90
    env:
      TZ: Etc/UTC
      CLICKHOUSE_PORT_TCP: 19001
      CLICKHOUSE_PORT_HTTP: 18124
      CLICKHOUSE_USER_FILES: ${{ github.workspace }}/tmp/clickhouse_test_server/user_files
    steps:
      - uses: actions/checkout@v4
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: clickhouse-binary
          path: build/programs
      - name: Run PR stateless tests
        run: |
          chmod +x build/programs/clickhouse
          rm -rf tmp/clickhouse_test_server
          mkdir -p tmp
          cp iceberg-warm-perf/tests/server-config.xml tmp/clickhouse_test_server-config.xml
          sed -i "s|@USER_FILES@|${CLICKHOUSE_USER_FILES}|" tmp/clickhouse_test_server-config.xml
          build/programs/clickhouse server --config-file tmp/clickhouse_test_server-config.xml > tmp/clickhouse_test_server.log 2>&1 &
          for _ in $(seq 1 120); do
            build/programs/clickhouse client --port "$CLICKHOUSE_PORT_TCP" -q "SELECT 1" >/dev/null 2>&1 && break
            sleep 1
          done
          build/programs/clickhouse client --port "$CLICKHOUSE_PORT_TCP" -q "SELECT 1" >/dev/null
          set -e
          cd tests
          for t in \
              04500_datalake_catalog_cache \
              04501_iceberg_manifest_prune_cache \
              05024_parquet_sorted_row_group_point_lookup; do
            echo "=== $t ==="
            ./clickhouse-test --binary ../build/programs/clickhouse "$t"
          done

  perf:
    needs: build
    runs-on: iceberg-warm-perf
    timeout-minutes: 120
    env:
      TZ: Etc/UTC
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - name: Download validation binary
        uses: actions/download-artifact@v4
        with:
          name: clickhouse-binary
          path: build/programs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dataset tooling
        run: pip install "pyiceberg[sql-sqlite,s3fs,pyiceberg-core]" pyarrow
      - name: Cache dataset
        id: dataset-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/tmp/iceberg_dataset
          key: iceberg-dataset-2025-01..06-v2
      - name: Build dataset (cache miss)
        if: steps.dataset-cache.outputs.cache-hit != 'true'
        run: |
          python3 iceberg-warm-perf/build_dataset.py \
            --location "${{ github.workspace }}/tmp/iceberg_dataset/nyc_taxi" \
            --download-dir "${{ github.workspace }}/tmp/iceberg_dataset/downloads" \
            --months 2025-01,2025-02,2025-03,2025-04,2025-05,2025-06
      - name: Download master baseline
        run: |
          mkdir -p tmp/binaries/master
          curl -fL --retry 3 -o tmp/binaries/master/clickhouse https://builds.clickhouse.com/master/amd64/clickhouse
          chmod +x tmp/binaries/master/clickhouse build/programs/clickhouse
      - name: Stage dataset on tmpfs
        run: |
          # Copy the cached dataset onto tmpfs when available so warm reads
          # are pure RAM; the copy takes seconds, the cache restore minutes.
          # Prefer the dedicated runner ramdisk, then /tmp.
          DATASET_ROOT="${{ github.workspace }}/tmp"
          TMPFS_DIR=""
          for candidate in "${BENCH_TMPFS_DIR:-/ramdisk}" /tmp; do
            if [ -d "$candidate" ] && [ "$(df -T "$candidate" | awk 'NR==2 {print $2}')" = "tmpfs" ]; then
              TMPFS_DIR="$candidate"
              break
            fi
          done
          if [ -n "$TMPFS_DIR" ]; then
            rm -rf "$TMPFS_DIR/iceberg_dataset"
            cp -a "${{ github.workspace }}/tmp/iceberg_dataset" "$TMPFS_DIR/iceberg_dataset"
            DATASET_ROOT="$TMPFS_DIR"
          fi
          echo "DATASET_ROOT=$DATASET_ROOT (tmpfs: ${TMPFS_DIR:-none})"
          echo "DATASET_ROOT=$DATASET_ROOT" >> "$GITHUB_ENV"
      - name: Run comparison
        run: |
          CATALOG_URI="sqlite:///$DATASET_ROOT/iceberg_dataset/downloads/catalog.db"
          LOCATION="$DATASET_ROOT/iceberg_dataset/nyc_taxi/nyc/taxis"
          export CATALOG_URI
          export WAREHOUSE="$DATASET_ROOT/iceberg_dataset/nyc_taxi"
          for C in 8 64; do
            echo "===== concurrency $C ====="
            BENCH_CONCURRENCY=$C iceberg-warm-perf/run_benchmark_rest.sh tmp/binaries/master/clickhouse "$CATALOG_URI" "$LOCATION" "before-$C"
            BENCH_CONCURRENCY=$C CATALOG_CACHE_SETTINGS="catalog_cache_staleness_ms=600000, catalog_cache_max_entries=16" \
              iceberg-warm-perf/run_benchmark_rest.sh build/programs/clickhouse "$CATALOG_URI" "$LOCATION" "after-$C"
            python3 iceberg-warm-perf/report.py --compare \
              "tmp/iceberg_warm_perf_results/before-$C" "tmp/iceberg_warm_perf_results/after-$C"
          done
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            tmp/iceberg_warm_perf_results
            tmp/iceberg_warm_perf_rest_catalog.log
          retention-days: 14
